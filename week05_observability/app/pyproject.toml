[project]
name = "inferapi"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pandas==3.0.5",
    "scikit-learn==1.9.1",
    "joblib==1.6.0",
    "pydantic-settings==2.15.0",
]

# We're building a single docker image, so might as well put them as extras of our app
[project.optional-dependencies]
serve = [
    "fastapi==0.141.1",
    "uvicorn==0.52.4",
    "pydantic==2.13.5",
    "opentelemetry-api==1.44.0",
    "opentelemetry-sdk==1.44.0",
    "opentelemetry-exporter-otlp-proto-http==1.44.0",
    "opentelemetry-exporter-prometheus==0.65b0",
    "opentelemetry-instrumentation-fastapi==0.65b0",
    # Imported directly by main.py in prometheus mode
    "prometheus-client==0.26.0",
]
train = [
    "pyarrow==25.0.1",
]
load = [
    "httpx==0.28.1",
]
